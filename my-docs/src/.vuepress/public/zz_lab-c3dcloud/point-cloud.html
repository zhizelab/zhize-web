<!doctype html>
<html>
<head>
    <meta name='viewport' content='width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover' />
    <meta charset='utf-8'>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <title>Point Cloud – zz_lab</title>
    <script type="importmap">{ "imports": {} }</script>
    <script>
    /* XHR patch: tell PlayCanvas to load point_cloud.ply */
    (function () {
        var TARGET_ID  = 271806273;
        var TARGET_URL = 'files/point_cloud.ply';
        var ON_ENT     = 'point_cloud';
        var OFF_ENT    = 'splat';

        function patchCfg(cfg) {
            Object.keys(cfg.assets || {}).forEach(function (id) {
                var a = cfg.assets[id];
                if (a.type !== 'gsplat') return;
                if (parseInt(id, 10) === TARGET_ID) {
                    a.preload = true;
                    if (a.file) { a.file.url = TARGET_URL; a.file.filename = TARGET_URL.split('/').pop(); }
                } else { a.preload = false; }
            });
        }
        function patchScene(s) {
            Object.keys(s.entities || {}).forEach(function (id) {
                var e = s.entities[id];
                if (!e.components || !e.components.gsplat) return;
                if (e.name === ON_ENT)  { e.enabled = true;  e.components.gsplat.asset = TARGET_ID; }
                if (e.name === OFF_ENT) { e.enabled = false; }
            });
        }

        var _open = XMLHttpRequest.prototype.open;
        var _send = XMLHttpRequest.prototype.send;

        XMLHttpRequest.prototype.open = function () {
            this._u = String(arguments[1] || '');
            return _open.apply(this, arguments);
        };
        XMLHttpRequest.prototype.send = function (body) {
            var isCfg = this._u && this._u.indexOf('config.json') !== -1;
            var isSc  = this._u && this._u.indexOf('2408306.json') !== -1;
            if (isCfg || isSc) {
                var orig = this.onreadystatechange, xhr = this;
                this.onreadystatechange = function () {
                    if (xhr.readyState === 4 && xhr.status === 200) {
                        try {
                            var p = xhr.response;
                            if (typeof p === 'string') p = JSON.parse(p);
                            else if (!p || typeof p !== 'object') p = JSON.parse(xhr.responseText);
                            if (p && typeof p === 'object') {
                                if (isCfg) patchCfg(p);
                                if (isSc)  patchScene(p);
                                var t = JSON.stringify(p);
                                try { Object.defineProperty(xhr, 'response',     { value: p, configurable: true, writable: true }); } catch(e) {}
                                try { Object.defineProperty(xhr, 'responseText', { value: t, configurable: true, writable: true }); } catch(e) {}
                            }
                        } catch(err) { console.warn('[XHR patch]', err); }
                    }
                    if (orig) orig.apply(this, arguments);
                };
            }
            return _send.apply(this, arguments);
        };
    })();
    </script>
</head>
<body>
    <script type='module' src="js/index.mjs"></script>
</body>
</html>
